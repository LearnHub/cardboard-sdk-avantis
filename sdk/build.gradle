apply plugin: 'com.android.library'
apply plugin: 'com.google.protobuf'

android {
    compileSdk = 35
    lintOptions {
        abortOnError = false
    }
    defaultConfig {
        // #gles3 #vulkan - You can reduce minSdkVersion down to 16 depending
        // on rendering APIs supported:
        //
        // OpenGL ES 2.0 - Requires 16 or higher
        // OpenGL ES 3.0 - Requires 18 or higher
        // Vulkan        - Requires 24 or higher
        //
        // See the release notes for details.
        minSdkVersion = 26
        targetSdkVersion = 35
        ndkVersion = "29.0.14206865"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild.cmake {
            arguments "-DANDROID_STL=c++_static"
        }
        defaultConfig {
            consumerProguardFiles 'proguard-rules.pro'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild.cmake {
        path "CMakeLists.txt"
    }
    sourceSets {
        // Sets path to java, jni, resources files and manifest location as it is not the default one.
        main {
            manifest.srcFile 'qrcode/android/AndroidManifest.xml'
            java.srcDirs = [
                    'qrcode/android/java',
                    'device_params/android/java',
                    'screen_params/android/java',
                    'java_utils/android/java',
                    '../java_api/src/main/java',
                    // AVN: ClassView capture source for the ClassVR Config app
                    'classview/android/java'
            ]
            aidl.srcDirs = ['classview/android/aidl']
            res.srcDirs = [
                    'qrcode/android/res',
                    '../java_api/src/main/res'
            ]
        }
        // Adds proto file and generated source files
        main.java.srcDirs += "${protobuf.generatedFilesBaseDir}/main/javalite"
        main.proto.srcDirs = ["${project.rootDir}/proto"]
        main.proto.includes = ["cardboard_device.proto"]
    }
    namespace = 'com.google.cardboard.sdk'

    // AVN: The ClassView capture source talks to the ClassVR Config app over AIDL
    buildFeatures {
        aidl = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// AVN: Copies the release AAR into the Avantis Cardboard XR Plugin for Unity under the name the
// plug-in expects. The plug-in is assumed to be checked out next to this repository; override
// with -PunityPluginDir=<path>.
tasks.register('copyAarToUnityPlugin') {
    dependsOn 'assembleRelease'
    doLast {
        def pluginDir = file(project.findProperty('unityPluginDir') ?: "${project.rootDir}/../cardboard-xr-plugin-avantis")
        def targetDir = new File(pluginDir, 'Runtime/Android')
        if (!targetDir.isDirectory()) {
            throw new GradleException("Cardboard XR Plugin not found at ${pluginDir}; pass -PunityPluginDir=<path>")
        }
        copy {
            from layout.buildDirectory.file('outputs/aar/sdk-release.aar')
            into targetDir
            rename { 'GfxPluginCardboard.aar' }
        }
        logger.lifecycle("Copied sdk-release.aar to ${targetDir}/GfxPluginCardboard.aar")
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.19.4'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Android Mobile Vision
    // TODO(b/217176538) Migrate to ML Kit.
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.protobuf:protobuf-javalite:3.19.4'
    implementation 'org.jspecify:jspecify:1.0.0'
}
